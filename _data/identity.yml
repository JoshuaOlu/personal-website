# About 50 words, for programmes, panels and introductions.
bio_short: >-
  Joshua Olunlade is an MPhil candidate in Engineering Education at the University of Cape Town's Centre for Research in Engineering Education (CREE). His research examines how Nigerian engineering undergraduates access industrial placements (SIWES). He is the founder and Executive Director of Care for Knowledge (CFK), a Nigerian nonprofit working to make educational resources more accessible.

# About 120 words, for conference programmes and longer introductions.
bio_long: >-
  Joshua Olunlade is an MPhil candidate in Engineering Education at the University of Cape Town's Centre for Research in Engineering Education (CREE), supervised by A/Prof. Bruce Kloot and Dr Lauren Jansen. His study, using constructivist grounded theory, examines how final-year engineering undergraduates in Nigeria find and secure industrial placements under the Students Industrial Work Experience Scheme (SIWES), and what that means for equity of access to work-integrated learning.
  He holds a B.Eng and an M.Eng in Mechanical Engineering from Adeleke University, Ede, where his thesis produced Tinkabot, a screen-free robotics kit for early computational thinking. His publications cover educational robotics and the teaching of engineering graphics in developing countries. He is the founder and Executive Director of Care for Knowledge (CFK), a Nigerian nonprofit working to make educational resources more accessible, and tutors in mechanical engineering at UCT.

