# What you want to be known for. Each topic is shown on the About page and
# tells search engines what you are an authority on. Keep them specific and
# true. Put the ones that matter most first.
# title: the topic | text: one or two sentences about your angle on it.
topics:
  - title: Engineering education in Nigeria
    text: How Nigerian engineering students learn, are placed in industry and move into the profession, studied with the students' own accounts at the centre.
  - title: Work-integrated learning and SIWES
    text: The Students Industrial Work Experience Scheme (SIWES) and who gets access to a good placement, and why it matters for equity.
  - title: Engineering education research in Africa
    text: Studying engineering education from within the African context, through the Centre for Research in Engineering Education (CREE) at the University of Cape Town.
  - title: Constructivist grounded theory
    text: Building theory from students' experiences rather than testing borrowed frameworks.
  - title: Computational thinking and educational robotics
    text: Screen-free, low-cost tangible programming for early STEM learning in resource-constrained schools, including the Tinkabot kit.
  - title: Teaching engineering graphics and CAD
    text: Open-source tools such as FreeCAD for teaching engineering graphics in developing countries.
  - title: Educational access and equity
    text: Care for Knowledge (CFK), a Nigerian nonprofit making educational resources reachable regardless of location or income.

