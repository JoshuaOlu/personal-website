# Shared by every mode. Use [words](address) for links.
about:
  title: A little about me
  text: >-
    I am an MPhil student in Engineering Education at the University of Cape Town,
    in the [Centre for Research in Engineering Education](https://ebe.uct.ac.za/cree).
    My research asks [how Nigerian engineering undergraduates find and secure industrial placements](/siwes/),
    and who gets left out when they do. I trained as a mechanical engineer, and the question
    that keeps pulling me back is a simple one: who gets a fair chance to learn, and what gets in the way?
  link_label: More about me
  link_url: /about/

cfk:
  title: Care for Knowledge
  text: >-
    Care for Knowledge (CFK) is the Nigerian nonprofit I founded. It works to make
    educational resources easier to reach, starting with secondary-school students.
  link_label: Visit CFK
  link_url: https://careforknowledge.org/

hello:
  title: Say hello
  text: >-
    If something here made you think, or you would like to talk about engineering education,
    industrial placements or access to learning, I would be glad to hear from you.
  button_label: Write to me
