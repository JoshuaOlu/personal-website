<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <nav class="navbar" aria-label="Main navigation">
    <a href="{{ '/' | relative_url }}" class="nav-logo">Joshua Olunlade</a>
    <div class="nav-links">
      {% for item in site.nav %}
        {% if item.external %}
          <a href="{{ item.url | relative_url }}" target="_blank" rel="noopener">{{ item.label }}</a>
        {% else %}
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.collection == 'projects' and item.url == '/research/' %} aria-current="page"{% endif %}>{{ item.label }}</a>
        {% endif %}
      {% endfor %}
    </div>
  </nav>
</header>
