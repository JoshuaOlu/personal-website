<nav class="navbar" aria-label="Main navigation">
  <a href="{{ '/' | relative_url }}" class="nav-logo">Joshua Olunlade</a>
  <div class="nav-links">
    {% for item in site.nav %}
      {% if item.external %}
        <a href="{{ item.url }}" target="_blank" rel="noopener">{{ item.label }}</a>
      {% else %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endif %}
    {% endfor %}
  </div>
</nav>
