# ─── Site identity ────────────────────────────────────────────────────────────
title: Joshua Olunlade
tagline: Engineering Education Researcher
description: >-
  Joshua Olunlade is an MPhil candidate in Engineering Education at the
  University of Cape Town, researching work-integrated learning access for
  Nigerian engineering undergraduates. Founder and Executive Director of
  Care for Knowledge (CFK).
author: Joshua Olunlade
# The one place the site's contact address lives. The home page button, the
# survey page and any project page that uses {email} all read it from here.
email: joshua@olunlade.com
lang: en
url: "https://joshua.olunlade.com"
baseurl: ""

# ─── Search and sharing (used by jekyll-seo-tag) ──────────────────────────────
# "social" tells search engines that these profiles all belong to one person.
social:
  name: Joshua Olunlade
  links:
    - https://www.linkedin.com/in/joshuaolunlade/
    - https://orcid.org/0009-0009-8152-3578
    - https://josholunlade.substack.com/
    - https://www.youtube.com/@josholunlade
    - https://twitter.com/josholunlade
    - https://www.instagram.com/josholunlade/
twitter:
  username: josholunlade
  card: summary_large_image

# ─── Navigation ───────────────────────────────────────────────────────────────
nav:
  - label: Research
    url: /research/
  - label: CV
    url: /assets/files/joshua-olunlade-cv.pdf
    external: true

# ─── Build settings ───────────────────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: pretty

# ─── Collections ──────────────────────────────────────────────────────────────
# Every file in _projects/ becomes a project page (see GUIDE.md).
collections:
  projects:
    output: true
    permalink: /research/:name/

# ─── Default front matter ─────────────────────────────────────────────────────
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project
      order: 50

# ─── Plugins ──────────────────────────────────────────────────────────────────
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# ─── Exclude from build ───────────────────────────────────────────────────────
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - GUIDE.md
  - templates
  - .gitignore
